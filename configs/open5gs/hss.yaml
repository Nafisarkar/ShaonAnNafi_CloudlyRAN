db_uri: mongodb://localhost/open5gs
logger:
  file: /home/vagrant/open5gs/install/var/log/open5gs/hss.log
#   level: info   # fatal|error|warn|info(default)|debug|trace

global:
  max:
    ue: 1024  # The number of UE can be increased depending on memory size.
#     peer: 64

hss:
  freeDiameter: /home/vagrant/open5gs/install/etc/freeDiameter/hss.conf
  metrics:
    server:
      - address: 127.0.0.8
        port: 9090